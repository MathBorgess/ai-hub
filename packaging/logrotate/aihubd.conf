# Packaging: logrotate para aihubd
#
# Configuração de rotação de log do aihubd para distribuições Linux que possuam logrotate.
# Caminho padrão do log: ~/.local/share/aihub/log/aihubd.log
#
# Para uso com logrotate em modo de usuário (sem root):
#   logrotate -s ~/.local/share/aihub/logrotate.status packaging/logrotate/aihubd.conf
#
# Ou instale/inclua no seu cron pessoal:
#   0 0 * * * /usr/sbin/logrotate -s ~/.local/share/aihub/logrotate.status ~/.local/share/aihub/logrotate.conf

~/.local/share/aihub/log/aihubd.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    copytruncate
    maxsize 10M
}
