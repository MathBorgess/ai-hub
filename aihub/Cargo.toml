[package]
name = "aihub"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
aihub-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
# native-tls: Mac remote wss:// through Cloudflare fails with rustls-webpki-roots
# ("TLS handshake rejected") while Security.framework succeeds. aihubd stays on
# the workspace rustls feature set for its own deps; only the TUI client overrides.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["native-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
vt100 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
aihub-router = { workspace = true }
